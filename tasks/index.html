<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6b6b6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>To Do</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>My Tasks</h1>
      <div class="header-menu">
        <button id="menu-btn" title="Menu">⋮</button>
        <div id="menu-dropdown" class="menu-dropdown">
          <button id="export-btn">Export</button>
          <button id="import-btn">Import</button>
          <button id="move-done-btn">Move completed to bottom</button>
        </div>
        <input type="file" id="file-input" accept=".json" style="display:none">
      </div>
    </div>
    <div class="input-group">
      <input type="text" id="todo-input" placeholder="Add new task">
      <button id="add-btn">Add</button>
    </div>
    <div class="search-group">
      <input type="text" id="search-input" placeholder="Search tasks...">
    </div>
    <ul id="todo-list"></ul>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">📝</div>
      <div class="empty-text">No tasks yet</div>
      <div class="empty-hint">Add a task above to get started</div>
    </div>
    <button id="clear-btn">Clear All</button>
    <div id="status-bar" class="status-bar"></div>
    <div id="item-menu" class="item-menu">
      <button data-action="edit">Edit</button>
      <button data-action="set-due">Set Due Date</button>
      <button data-action="tags">Manage Tags</button>
      <button data-action="reorder">Reorder</button>
    </div>
    <div id="date-picker" class="date-picker">
      <input type="date" id="picker-date-input">
      <div class="date-picker-buttons">
        <button id="date-ok">OK</button>
        <button id="date-cancel">Cancel</button>
        <button id="date-remove">Remove</button>
      </div>
    </div>
    <div id="tag-picker" class="tag-picker">
      <input type="text" id="tag-input" placeholder="Add tags (comma separated)">
      <div class="tag-picker-buttons">
        <button id="tag-ok">OK</button>
        <button id="tag-cancel">Cancel</button>
      </div>
      <div id="current-tags" class="current-tags"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
